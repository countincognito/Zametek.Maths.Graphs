name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    # Pinned rather than ubuntu-latest, so that the image changes only when this line does.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Pinned rather than '10.x', so that a new SDK's analyzers cannot fail the build without a change to the code.
          # Bump it deliberately.
          dotnet-version: '10.0.402'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release

      # No continue-on-error here: a failing test suite must fail the build.
      - name: Run tests
        # No --results-directory: each test project then writes its results into its own TestResults folder.
        # With one shared folder the two projects wrote the same results.trx, and only the last to finish was kept.
        run: |
          dotnet test --no-build --configuration Release --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      # Note: `uses:` action inputs resolve from the workspace root, not from
      # the job's run working-directory, hence the dotnet/ prefixes below.
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: dotnet/test/*/TestResults/test-results.trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # 5.5.11
        if: always()
        with:
          reports: dotnet/test/*/TestResults/**/coverage.cobertura.xml
          targetdir: dotnet/CoverageReport
          reporttypes: HtmlInline;MarkdownSummaryGithub

      - name: Publish coverage summary
        if: always()
        run: cat ./CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: dotnet/CoverageReport

  # The Rust port must stay at behavioural parity with the C# implementation:
  # its golden tests mirror the C# expected values, so this job is the drift
  # alarm for cross-language divergence.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the compiler and the components the checks below need. The rustup that the runner
      # image ships installs exactly that, so no new release of Rust can change this job without a change to the file.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      # Warnings are errors: any clippy finding must fail the build.
      # --locked: the build uses the versions in Cargo.lock, and fails if the lock file is out of date.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # The sample-project example self-asserts against a schedule computed by
      # the C# implementation, so running it is an end-to-end parity check.
      - name: Run parity example
        run: cargo run --locked --example sample_project
