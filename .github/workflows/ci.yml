name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  # A run on demand, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the run that is still going for it. The runs for develop and master all
  # finish, so that every commit on them has its result.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test
    # Pinned rather than ubuntu-latest, so that the image changes only when this line does.
    runs-on: ubuntu-24.04
    # A normal run takes 1 to 3 minutes; a hung test must not hold the runner for the default 6 hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotnet

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          # dotnet/global.json keeps dotnet on .NET 10. Without it, dotnet takes the newest SDK of the runner image, and the
          # image of 2026-11-11 has 11.0.100. With it, dotnet takes the newest .NET 10 SDK of the runner: this one, or a later
          # one that the image has. Bump this version deliberately, and in release.yml too.
          dotnet-version: '10.0.402'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check code style
        # 'style' and 'analyzers', not the whole of 'dotnet format': dotnet/.editorconfig asks for CRLF, but this
        # checkout has LF (.gitattributes), so the whitespace check would fail on every file.
        run: dotnet format style --verify-no-changes --verbosity minimal

      - name: Check analyzer rules
        run: dotnet format analyzers --verify-no-changes --verbosity minimal

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release

      # No continue-on-error here: a failing test suite must fail the build.
      - name: Run tests
        # No --results-directory: each test project then writes its results into its own TestResults folder.
        # With one shared folder the two projects wrote the same results.trx, and only the last to finish was kept.
        run: |
          dotnet test --no-build --configuration Release --verbosity normal \
            --logger "trx;LogFileName=test-results.trx" \
            --collect:"XPlat Code Coverage"

      # Packing in every build brings a packaging problem to the pull request, not to the day of the release: a missing
      # file, a broken reference, or a change that breaks the API of the last release on nuget.org, which pack.sh
      # compares with. The release workflow packs with the same script.
      - name: Pack
        run: bash ../.github/scripts/pack.sh "$RUNNER_TEMP/packages"

      # Note: `uses:` action inputs resolve from the workspace root, not from
      # the job's run working-directory, hence the dotnet/ prefixes below.
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: dotnet/test/*/TestResults/test-results.trx

      - name: Generate coverage report
        uses: danielpalme/ReportGenerator-GitHub-Action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # 5.6.0
        if: always()
        with:
          reports: dotnet/test/*/TestResults/**/coverage.cobertura.xml
          targetdir: dotnet/CoverageReport
          reporttypes: HtmlInline;MarkdownSummaryGithub

      - name: Publish coverage summary
        if: always()
        run: cat ./CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: dotnet/CoverageReport

  # The Rust port must stay at behavioural parity with the C# implementation:
  # its golden tests mirror the C# expected values, so this job is the drift
  # alarm for cross-language divergence.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the compiler and the components the checks below need. The rustup that the runner
      # image ships installs exactly that, so no new release of Rust can change this job without a change to the file.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Check formatting
        run: cargo fmt --all --check

      # Warnings are errors: any clippy finding must fail the build.
      # --locked: the build uses the versions in Cargo.lock, and fails if the lock file is out of date.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      # The sample-project example self-asserts against a schedule computed by
      # the C# implementation, so running it is an end-to-end parity check.
      - name: Run parity example
        run: cargo run --locked --example sample_project
